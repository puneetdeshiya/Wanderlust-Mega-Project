apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: wanderlust
  labels:
    app: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: madhupdevops/wanderlust-backend-beta:v3.0.18

          # Override image CMD (npm start -> nodemon)
          command:
            - node

          args:
            - server.js

          ports:
            - containerPort: 8080

          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: backend-service
  namespace: wanderlust

spec:
  type: NodePort

  selector:
    app: backend

  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 31100
